name: crm
description: "WaTech mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  http: ^1.6.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  file_picker: ^10.3.10
  camera: ^0.12.0+2
  photo_manager: ^3.12.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  flutter_image_compress: ^2.4.0
  share_plus: ^11.0.0
  record: ^6.0.0
  audioplayers: ^6.5.0
  video_player: ^2.10.0
  url_launcher: ^6.3.1
  app_links: ^7.2.1
  firebase_messaging: ^16.5.0
  flutter_contacts: ^2.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/watech_logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/watech_logo.png
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: assets/watech_logo.png
    background_color: "#FFFFFF"
    theme_color: "#0D7A4A"

flutter:
  uses-material-design: true
  assets:
    - assets/watech_logo.png
